<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1419;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffb940;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9c1f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="675" fill="url(#grad4)"/>
  
  <!-- Warm overlay -->
  <rect width="1200" height="675" fill="url(#accent4)" opacity="0.04"/>
  
  <!-- Card 1 -->
  <g transform="translate(150, 120)">
    <rect width="120" height="160" rx="8" fill="#ffb940" opacity="0.15" stroke="#ffb940" stroke-width="2"/>
    <circle cx="60" cy="35" r="25" fill="#ffb940" opacity="0.3"/>
    <rect x="10" y="70" width="100" height="60" rx="4" fill="#ffb940" opacity="0.2"/>
    <text x="60" y="200" font-size="12" fill="#ffb940" text-anchor="middle" font-weight="bold">Card 1</text>
  </g>
  
  <!-- Card 2 -->
  <g transform="translate(350, 150)">
    <rect width="120" height="160" rx="8" fill="#ff9c1f" opacity="0.2" stroke="#ff9c1f" stroke-width="2"/>
    <circle cx="60" cy="35" r="25" fill="#ff9c1f" opacity="0.4"/>
    <rect x="10" y="70" width="100" height="60" rx="4" fill="#ff9c1f" opacity="0.25"/>
    <text x="60" y="200" font-size="12" fill="#ff9c1f" text-anchor="middle" font-weight="bold">Card 2</text>
  </g>
  
  <!-- Card 3 -->
  <g transform="translate(550, 100)">
    <rect width="120" height="160" rx="8" fill="#ffb940" opacity="0.2" stroke="#ffb940" stroke-width="2"/>
    <circle cx="60" cy="35" r="25" fill="#ffb940" opacity="0.35"/>
    <rect x="10" y="70" width="100" height="60" rx="4" fill="#ffb940" opacity="0.2"/>
    <text x="60" y="200" font-size="12" fill="#ffb940" text-anchor="middle" font-weight="bold">Card 3</text>
  </g>
  
  <!-- Automation flow on right -->
  <g transform="translate(850, 180)">
    <rect x="0" y="0" width="200" height="80" rx="6" fill="#ffb940" opacity="0.15" stroke="#ffb940" stroke-width="2"/>
    <text x="100" y="35" font-size="16" fill="#ffb940" text-anchor="middle" font-weight="bold">Automation</text>
    <text x="100" y="60" font-size="12" fill="#ffb940" text-anchor="middle" opacity="0.7">Fast Workflows</text>
  </g>
  
  <!-- Connection line -->
  <line x1="670" y1="220" x2="850" y2="220" stroke="#ffb940" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  
  <!-- Title -->
  <text x="600" y="450" font-size="42" font-weight="bold" fill="#ffffff" text-anchor="middle">E-Cards</text>
  <text x="600" y="490" font-size="18" fill="#ffb940" text-anchor="middle">PowerShell Automation for Card Generation</text>
  
  <!-- Tech tags -->
  <g transform="translate(300, 550)">
    <rect width="130" height="40" rx="6" fill="#ffb940" opacity="0.2" stroke="#ffb940" stroke-width="1.5"/>
    <text x="65" y="26" font-size="14" fill="#ffb940" text-anchor="middle" font-weight="500">PowerShell</text>
  </g>
  
  <g transform="translate(470, 550)">
    <rect width="120" height="40" rx="6" fill="#ff9c1f" opacity="0.2" stroke="#ff9c1f" stroke-width="1.5"/>
    <text x="60" y="26" font-size="14" fill="#ff9c1f" text-anchor="middle" font-weight="500">Automation</text>
  </g>
</svg>