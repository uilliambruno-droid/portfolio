<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1419;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6d5ff7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5038d1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="675" fill="url(#grad5)"/>
  
  <!-- Purple overlay -->
  <rect width="1200" height="675" fill="url(#accent5)" opacity="0.04"/>
  
  <!-- Service boxes stacked -->
  <g transform="translate(200, 120)">
    <!-- Service 1 -->
    <rect x="0" y="0" width="140" height="70" rx="6" fill="#6d5ff7" opacity="0.2" stroke="#6d5ff7" stroke-width="2"/>
    <text x="70" y="40" font-size="13" fill="#6d5ff7" text-anchor="middle" font-weight="bold">Service 1</text>
    
    <!-- Service 2 -->
    <rect x="0" y="90" width="140" height="70" rx="6" fill="#6d5ff7" opacity="0.15" stroke="#6d5ff7" stroke-width="2"/>
    <text x="70" y="130" font-size="13" fill="#6d5ff7" text-anchor="middle" font-weight="bold">Service 2</text>
    
    <!-- Service 3 -->
    <rect x="0" y="180" width="140" height="70" rx="6" fill="#5038d1" opacity="0.2" stroke="#5038d1" stroke-width="2"/>
    <text x="70" y="220" font-size="13" fill="#5038d1" text-anchor="middle" font-weight="bold">Service 3</text>
  </g>
  
  <!-- Connection to business logic -->
  <g transform="translate(450, 150)">
    <path d="M 0 50 Q 50 0 100 50" stroke="#6d5ff7" stroke-width="2" fill="none" opacity="0.5"/>
    <circle cx="50" cy="30" r="8" fill="#6d5ff7" opacity="0.6"/>
  </g>
  
  <!-- Business logic core -->
  <circle cx="700" cy="220" r="60" fill="#6d5ff7" opacity="0.15" stroke="#6d5ff7" stroke-width="2"/>
  <circle cx="700" cy="220" r="40" fill="none" stroke="#6d5ff7" stroke-width="2" opacity="0.3"/>
  <text x="700" y="230" font-size="14" fill="#6d5ff7" text-anchor="middle" font-weight="bold">Business</text>
  <text x="700" y="250" font-size="14" fill="#6d5ff7" text-anchor="middle" font-weight="bold">Logic</text>
  
  <!-- API ready architecture -->
  <g transform="translate(920, 160)">
    <rect x="0" y="0" width="160" height="120" rx="6" fill="#6d5ff7" opacity="0.12" stroke="#6d5ff7" stroke-width="2"/>
    <text x="80" y="30" font-size="14" fill="#6d5ff7" text-anchor="middle" font-weight="bold">API-Ready</text>
    <text x="80" y="55" font-size="12" fill="#6d5ff7" text-anchor="middle">Structured</text>
    <text x="80" y="75" font-size="12" fill="#6d5ff7" text-anchor="middle">Endpoints</text>
  </g>
  
  <!-- Title -->
  <text x="600" y="450" font-size="42" font-weight="bold" fill="#ffffff" text-anchor="middle">Laborit Project</text>
  <text x="600" y="490" font-size="18" fill="#6d5ff7" text-anchor="middle">Service-Oriented Backend with Business Rules</text>
  
  <!-- Tech tags -->
  <g transform="translate(300, 550)">
    <rect width="100" height="40" rx="6" fill="#6d5ff7" opacity="0.2" stroke="#6d5ff7" stroke-width="1.5"/>
    <text x="50" y="26" font-size="14" fill="#6d5ff7" text-anchor="middle" font-weight="500">Python</text>
  </g>
  
  <g transform="translate(440, 550)">
    <rect width="110" height="40" rx="6" fill="#6d5ff7" opacity="0.15" stroke="#6d5ff7" stroke-width="1.5"/>
    <text x="55" y="26" font-size="14" fill="#6d5ff7" text-anchor="middle" font-weight="500">Backend</text>
  </g>
  
  <g transform="translate(580, 550)">
    <rect width="130" height="40" rx="6" fill="#5038d1" opacity="0.2" stroke="#5038d1" stroke-width="1.5"/>
    <text x="65" y="26" font-size="14" fill="#5038d1" text-anchor="middle" font-weight="500">API Design</text>
  </g>
</svg>