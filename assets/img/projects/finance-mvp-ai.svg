<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1419;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a885;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="675" fill="url(#grad2)"/>
  
  <!-- Gradient overlay -->
  <rect width="1200" height="675" fill="url(#accent2)" opacity="0.05"/>
  
  <!-- Finance graph -->
  <g transform="translate(200, 120)">
    <!-- Bars -->
    <rect x="0" y="120" width="35" height="80" fill="#00d4aa" opacity="0.3" stroke="#00d4aa" stroke-width="2" rx="4"/>
    <rect x="50" y="90" width="35" height="110" fill="#00d4aa" opacity="0.5" stroke="#00d4aa" stroke-width="2" rx="4"/>
    <rect x="100" y="60" width="35" height="140" fill="#00d4aa" opacity="0.7" stroke="#00d4aa" stroke-width="2" rx="4"/>
    <rect x="150" y="30" width="35" height="170" fill="#00d4aa" stroke="#00d4aa" stroke-width="2" rx="4"/>
    
    <!-- Grid lines -->
    <line x1="-10" y1="0" x2="200" y2="0" stroke="#00d4aa" stroke-width="1" opacity="0.2"/>
    <line x1="-10" y1="60" x2="200" y2="60" stroke="#00d4aa" stroke-width="1" opacity="0.2"/>
    <line x1="-10" y1="120" x2="200" y2="120" stroke="#00d4aa" stroke-width="1" opacity="0.2"/>
  </g>
  
  <!-- AI circle -->
  <circle cx="850" cy="200" r="80" fill="#00d4aa" opacity="0.15" stroke="#00d4aa" stroke-width="2"/>
  <circle cx="850" cy="200" r="60" fill="none" stroke="#00d4aa" stroke-width="2" opacity="0.3"/>
  <circle cx="850" cy="200" r="40" fill="none" stroke="#00d4aa" stroke-width="2" opacity="0.5"/>
  <text x="850" y="210" font-size="28" font-weight="bold" fill="#00d4aa" text-anchor="middle">AI</text>
  
  <!-- Connecting nodes -->
  <g stroke="#00d4aa" stroke-width="2" opacity="0.4">
    <line x1="450" y1="200" x2="770" y2="200"/>
  </g>
  
  <circle cx="450" cy="200" r="25" fill="#00d4aa" opacity="0.2" stroke="#00d4aa" stroke-width="2"/>
  <text x="450" y="210" font-size="14" fill="#00d4aa" text-anchor="middle" font-weight="bold">Python</text>
  
  <!-- Title -->
  <text x="600" y="450" font-size="42" font-weight="bold" fill="#ffffff" text-anchor="middle">Finance MVP AI</text>
  <text x="600" y="490" font-size="18" fill="#00d4aa" text-anchor="middle">Financial Workflows + AI Backend Logic</text>
  
  <!-- Tech tags -->
  <g transform="translate(300, 550)">
    <rect width="100" height="40" rx="6" fill="#00d4aa" opacity="0.2" stroke="#00d4aa" stroke-width="1.5"/>
    <text x="50" y="26" font-size="14" fill="#00d4aa" text-anchor="middle" font-weight="500">Python</text>
  </g>
  
  <g transform="translate(440, 550)">
    <rect width="90" height="40" rx="6" fill="#00d4aa" opacity="0.15" stroke="#00d4aa" stroke-width="1.5"/>
    <text x="45" y="26" font-size="14" fill="#00d4aa" text-anchor="middle" font-weight="500">Finance</text>
  </g>
  
  <g transform="translate(560, 550)">
    <rect width="70" height="40" rx="6" fill="#00a885" opacity="0.2" stroke="#00a885" stroke-width="1.5"/>
    <text x="35" y="26" font-size="14" fill="#00a885" text-anchor="middle" font-weight="500">AI</text>
  </g>
</svg>