<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1419;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eb2f96;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b61d5e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="675" fill="url(#grad10)"/>
  
  <!-- Pink overlay -->
  <rect width="1200" height="675" fill="url(#accent10)" opacity="0.04"/>
  
  <!-- FastAPI label -->
  <g transform="translate(150, 120)">
    <rect x="0" y="0" width="140" height="80" rx="6" fill="#eb2f96" opacity="0.15" stroke="#eb2f96" stroke-width="2"/>
    <text x="70" y="28" font-size="16" fill="#eb2f96" text-anchor="middle" font-weight="bold">FastAPI</text>
    <text x="70" y="50" font-size="12" fill="#eb2f96" text-anchor="middle">Framework</text>
  </g>
  
  <!-- Blog structure -->
  <g transform="translate(450, 100)">
    <!-- Post 1 -->
    <rect x="0" y="0" width="100" height="55" rx="5" fill="#eb2f96" opacity="0.2" stroke="#eb2f96" stroke-width="2"/>
    <line x1="5" y1="18" x2="95" y2="18" stroke="#eb2f96" stroke-width="1.5" opacity="0.5"/>
    <line x1="5" y1="32" x2="85" y2="32" stroke="#eb2f96" stroke-width="1" opacity="0.4"/>
    <text x="50" y="60" font-size="11" fill="#eb2f96" text-anchor="middle" font-weight="bold">Posts</text>
    
    <!-- Comment 2 -->
    <rect x="0" y="75" width="100" height="55" rx="5" fill="#b61d5e" opacity="0.15" stroke="#b61d5e" stroke-width="2"/>
    <line x1="5" y1="93" x2="95" y2="93" stroke="#b61d5e" stroke-width="1.5" opacity="0.4"/>
    <text x="50" y="135" font-size="11" fill="#b61d5e" text-anchor="middle" font-weight="bold">Comments</text>
  </g>
  
  <!-- Connection arrows -->
  <g stroke="#eb2f96" stroke-width="2" opacity="0.3" stroke-dasharray="5,5">
    <path d="M 290 150 Q 370 140 450 130"/>
  </g>
  
  <!-- REST endpoints -->
  <g transform="translate(750, 130)">
    <rect x="0" y="0" width="150" height="110" rx="6" fill="#eb2f96" opacity="0.12" stroke="#eb2f96" stroke-width="2"/>
    <text x="75" y="30" font-size="13" fill="#eb2f96" text-anchor="middle" font-weight="bold">REST Endpoints</text>
    <text x="75" y="55" font-size="11" fill="#eb2f96" text-anchor="middle">CRUD</text>
    <text x="75" y="75" font-size="11" fill="#eb2f96" text-anchor="middle">Optimized</text>
  </g>
  
  <!-- Title -->
  <text x="600" y="450" font-size="42" font-weight="bold" fill="#ffffff" text-anchor="middle">FastAPI Blog</text>
  <text x="600" y="490" font-size="18" fill="#eb2f96" text-anchor="middle">Blog Backend API with Clean Architecture</text>
  
  <!-- Tech tags -->
  <g transform="translate(300, 550)">
    <rect width="110" height="40" rx="6" fill="#eb2f96" opacity="0.2" stroke="#eb2f96" stroke-width="1.5"/>
    <text x="55" y="26" font-size="14" fill="#eb2f96" text-anchor="middle" font-weight="500">FastAPI</text>
  </g>
  
  <g transform="translate(450, 550)">
    <rect width="100" height="40" rx="6" fill="#eb2f96" opacity="0.15" stroke="#eb2f96" stroke-width="1.5"/>
    <text x="50" y="26" font-size="14" fill="#eb2f96" text-anchor="middle" font-weight="500">REST API</text>
  </g>
  
  <g transform="translate(590, 550)">
    <rect width="120" height="40" rx="6" fill="#b61d5e" opacity="0.2" stroke="#b61d5e" stroke-width="1.5"/>
    <text x="60" y="26" font-size="14" fill="#b61d5e" text-anchor="middle" font-weight="500">Backend</text>
  </g>
</svg>